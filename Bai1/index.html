<html>
    <head>
        <title>bai 1 html</title>
    </head>
    <body>
        Môn phát triển ứng dụng web + BTL

        <!-- Để chú thích dùng 2 cách
        Cách 1 : ctrl + k + c
        Cách 2 : ctrl + /
        Đây là chú thích -->

        <p> Thẻ p là thẻ phân đoạn </p>

        <!-- Thẻ h là thẻ định dạng đề mục -->
        <h1> Thẻ H1 </h1>
        <h2> Thẻ H2 </h2>
        <h3> Thẻ H3 </h3>

        <!-- Thẻ br để xuống dòng -->
        <p> Môn web <br> Nhóm 03 </p>

        <!-- Thẻ div và span để phân chia đoạn -->
         <div> Đây là thẻ div</div>
         <span> Đây là thẻ span </span> <br> 

         <!-- Thẻ b viết đậm
         Thẻ i viết nghiêng
         Thẻ u gạch chân -->
         <b> Thẻ b </b> <br> 
         <i> Thẻ i </i> <br>
         <u> Thẻ u </u> <br>

         <div> 
            <!-- Định dạng phông chữ -->
            <!-- Phông chữ -->
            <font face="verdara">Môn Phát Triển Ứng Dụng Web</font> <br>
            <!-- Màu chữ -->
             <font color="blue">Nhóm 03</front> <br>
            <!-- Size chữ  -->
             <font size="10"> Tiết 1 2</font> <br>
         </div>
         <div>
            <font face="vedora" color="green" size="12">Hùng Nguyễn</font> <br>
         </div>
    </body>
</html>
