<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            color: blue;
        }
        
        p.nhom {
            color: red;
        }
    </style>

    <style>
        .khoi1 {
            background-color: green;
        }
        
        .khoi2 {
            background-color: red;
            /* 1 giá trị: cách đều xung quanh = giá trị đó */
            /* 2 giá trị: giá trị đầu(trên dưới), giá trị 2(trái phải) */
            /* 4 giá trị: trên phải dưới trái */
            margin: 50px 200px 10px 100px;
            padding: 50px;
            /* tương tự margin */
            /* margin: auto  tự động căn ra giữa */
        }
        
        .khoi3 {
            background-color: yellow;
        }
        
        .khoi4 {
            background-color: aqua;
            display: flex;
        }
        
        .khoi5 {
            background-color: gray;
            width: 50%;
        }
        
        .khoi6 {
            background-color: blueviolet;
            width: 50%;
        }
    </style>
</head>

<body>
    <h1 style="color: red;">Trường Đại học Mỏ - Địa chất</h1>
    <p class="nhom">Nhóm 03</p>
    <p>HUMG</p>

    <div class="khoi1">Khối 1</div>
    <div class="khoi2">Khối 2</div>
    <div class="khoi3">Khối 3</div>

    <div class="khoi4">
        <div class="khoi5">Khối 5</div>
        <div class="khoi6">Khối 6</div>
    </div>

</body>

</html>
