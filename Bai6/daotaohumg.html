<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đào tạo</title>
    <style>
        body {
            margin: 0;
            /*sát 2 bên lề */
        }
        
        .danh-sach-muc {
            padding: 0;
            /*sát lề trên */
            margin: 0;
            /* bỏ dấu chấm ở danh sách khi dùng ul,li */
            list-style: none;
            display: flex;
            /* gap: khoảng cách các đối tượng ở trong */
            gap: 20px;
        }
        
        .danh-muc {
            background-color: #198cf0;
            padding: 10px;
        }
        
        .lien-ket {
            color: white;
            /* bỏ gạch chân thẻ a*/
            text-decoration: none;
        }
        
        .muc {}
        
        main {
            display: flex;
        }
        
        .trai {
            width: 20%;
            /* background-color: red; */
            height: 100dvh;
            /* tạo đường viền dùng border */
            /* 3 tham số: độ dày, loại đường viền, màu sắc */
            border-right: 1px solid #198cf0;
        }
        
        .khoi-dang-nhap {
            /* background-color: gray; */
            width: 100%;
            height: 100px;
        }
        
        form {
            /* background-color: antiquewhite; */
            width: 80%;
            margin: 10px auto;
        }
        
        .khoi-thong-tin {
            width: 100%;
        }
        
        .p {
            margin: 0;
        }
        
        input {
            width: 100%;
            padding: 5px 0;
        }
        
        .quen-mat-khau {
            display: flex;
            justify-content: flex end;
        }
        
        .quen-mat-khau-lien-ket {
            color: #198cf0;
            text-decoration: none;
        }
        
        button {
            width: 100%;
            padding: 5px 0;
            border-radius: 5px;
        }
        
        .login {
            margin-bottom: 5px;
        }
        
        .phai {
            width: 80%;
        }
    </style>
</head>

<body>
    <!-- Danh mục -->
    <nav class="danh-muc">
        <ul class="danh-sach-muc">
            <li class="muc"><a href="#" class="lien-ket">Thực tập, đồ án</a></li>
            <li class="muc"><a href="#" class="lien-ket">Thủ tục một cửa</a></li>
            <li class="muc"><a href="#" class="lien-ket">Một cửa online</a></li>
            <li class="muc"><a href="#" class="lien-ket">Email HUMG</a></li>
        </ul>
    </nav>
    <main>
        <div class="trai">
            <div class="khoi-dang-nhap">
                <form action="">
                    <div class="khoi-thong-tin">
                        <p>Tài Khoản</p>
                        <input type="text" name="" value="">
                    </div>
                    <div class="khoi-thong-tin">
                        <p>Mật Khẩu</p>
                        <input type="Password" name="" value="">
                    </div>
                    <div class="quen-mat-khau">
                        <a class="quen-mat-khau-lien-ket" href="">Quên mật khẩu</a>
                    </div>
                    <div class="khoi-thong-tin">
                        <button ">Đăng Nhập</button>
                        <button>Đăng nhập với Microsoft Office</button>
                    </div>
                     <div class="phai ">
            <div class="danh-sach-tin ">
                <div class="tin ">
                    <div class="chuc-nang ">
                        <div class="tieu-de "></div>
                        <div class="xem-tiep "></div>
                    </div>
                </div>
            </div>
        </div>
                </form>
            </div>
        </div>
        <div class="phai ">Phải</div>
    </main>
</body>

</html>
